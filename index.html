<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leerpuls</title>
<meta name="description" content="Leer met je eigen studiestof: oefentoetsen, flashcards, gesprekken oefenen en uitleg met AI. Leerpuls by Deekman Enterprises.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161D36'/%3E%3Crect x='6' y='17' width='20' height='6' fill='%23F4E840'/%3E%3Cpath d='M9 8v14h13' stroke='%23fff' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#161D36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leerpuls">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: één studiebureau — kop, schuifbare tabstrook, één werkkolom; systeemkaarten en markeerstift dragen de identiteit */
:root{
  --paper:#F4F6FA; --card:#FFFFFF; --ink:#161D36; --muted:#5A6280; --line:#DCE0EA;
  --pen:#3446D1; --hl:rgba(244,232,64,.9); --hl-solid:#F4E840; --on-hl:#161D36;
  --good:#1D8657; --good-bg:#E3F4EB; --bad:#BF3B34; --bad-bg:#FBE7E5; --warn:#A86A12; --warn-bg:#FBF0DC;
  --rule:#C9D6F2; --margin:#E58B8B;
  --v1:#3446D1; --v2:#1D8657; --v3:#C2410C; --v4:#8B3FD1; --v5:#0E7490; --v6:#B4235A;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0F1220; --card:#181C2C; --ink:#E7E9F2; --muted:#9AA1BB; --line:#2A3048;
  --pen:#8E9BFF; --hl:rgba(222,210,60,.38); --hl-solid:#DED23C; --on-hl:#161D36;
  --good:#4CC38A; --good-bg:#15301F; --bad:#F07068; --bad-bg:#3A1A1A; --warn:#E3AC4E; --warn-bg:#33270F;
  --rule:#26304D; --margin:#8A4A4A;
  --v1:#8E9BFF; --v2:#4CC38A; --v3:#F39A5B; --v4:#C29BFF; --v5:#4FC3DA; --v6:#F07AA6; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:env(safe-area-inset-top,0px) 48px}
img{max-width:100%}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.mark{background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 .1em}
.muted{color:var(--muted)} .small{font-size:.875rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* kop */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.brand .by{font-size:.8rem;color:var(--muted)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.streak{font-family:var(--f-mono);font-size:.82rem;background:var(--hl);color:var(--ink);border-radius:20px;padding:2px 10px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:24px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-weight:700;background:none;border:0;color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--hl-solid)}
.tab:hover{color:var(--ink)}
.tab .n{font-family:var(--f-mono);font-size:.75rem;background:var(--hl);color:var(--ink);border-radius:20px;padding:0 6px;margin-left:4px}

/* vlakken */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0}
.stack{display:grid;gap:16px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-items:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.notice{border-radius:var(--r);padding:12px 14px;font-size:.92rem;background:var(--warn-bg);color:var(--ink);border:1px solid var(--line)}

/* bediening */
button{font:inherit}
.btn{font-weight:700;border-radius:8px;padding:9px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;line-height:1.3}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn.hl{background:var(--hl-solid);border-color:var(--hl-solid);color:var(--on-hl)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;color:var(--pen);cursor:pointer;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px}
input[type=checkbox]{width:auto}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:.85rem;font-weight:700}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-weight:700;font-size:.9rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:20px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* stofkiezer */
.picker{display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:20px;padding:5px 12px;font-size:.9rem;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--hl);border-color:var(--hl-solid);font-weight:700}
.pill{display:inline-block;font-size:.75rem;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.vakdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--vc,var(--line));flex:none}

/* lijsten */
.list{display:grid;border-top:1px solid var(--line)}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item .main{min-width:0;flex:1 1 220px;display:grid;gap:2px}
.item .t{font-weight:700;overflow-wrap:anywhere}
.preview{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.9rem;white-space:pre-wrap;max-height:300px;overflow:auto;flex-basis:100%}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}

/* vakken */
.vakgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.vakcard{text-align:left;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:grid;gap:8px;position:relative;overflow:hidden}
.vakcard::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--vc)}
.vakcard:hover{border-color:var(--ink)}
.vakcard b{font-family:var(--f-display);font-size:1.15rem}
.swatches{display:flex;gap:6px}
.swatches button{width:26px;height:26px;border-radius:6px;border:2px solid transparent;background:var(--vc);cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}

/* cijfers */
.cijfer{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.cijfer.big{font-size:4rem;line-height:1}
.cijfer.v{color:var(--good)} .cijfer.o{color:var(--bad)}
.grade{font-family:var(--f-mono);font-size:.85rem;padding:2px 8px;border-radius:6px;font-weight:500}
.grade.v{background:var(--good-bg);color:var(--good)} .grade.o{background:var(--bad-bg);color:var(--bad)}

/* upload */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:grid;gap:8px;justify-items:center;cursor:pointer;background:var(--paper)}
.drop.over{border-color:var(--pen);background:var(--card)}
.drop input{display:none}

/* toets */
.q{font-size:1.2rem;font-weight:700;line-height:1.4}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-family:var(--f-mono);color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hl-solid)}
.fb{border-left:4px solid var(--line);padding:6px 12px;font-size:.95rem;display:grid;gap:4px}
.fb.good{border-color:var(--good)} .fb.bad{border-color:var(--bad)} .fb.half{border-color:var(--warn)}

/* systeemkaart */
.cardwrap{display:grid;justify-items:center;gap:16px}
.icard{width:min(100%,560px);aspect-ratio:5/3;max-width:100%;background-color:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px -18px rgba(22,29,54,.5);position:relative;
  background-image:linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 47px,transparent 47px),repeating-linear-gradient(var(--card) 0 31px,var(--rule) 31px 32px);
  background-position:0 0,0 44px;padding:52px 24px 20px 62px;display:flex;align-items:center;cursor:pointer;overflow:auto}
.icard .side{position:absolute;top:12px;left:62px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.icard .txt{font-size:1.25rem;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.icard.back .txt{font-weight:400;font-size:1.1rem}
.boxes{display:flex;gap:4px}
.boxes i{width:16px;height:10px;border-radius:2px;background:var(--line)}
.boxes i.on{background:var(--hl-solid)}

/* gesprek */
.chat{display:grid;gap:12px;max-height:56vh;overflow-y:auto;padding:4px}
.msg{max-width:min(85%,620px);padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{background:var(--paper);border:1px solid var(--line);justify-self:start;border-bottom-left-radius:4px}
.msg.me{background:var(--ink);color:var(--paper);justify-self:end;border-bottom-right-radius:4px}
.msg.tip{background:var(--hl);color:var(--ink);justify-self:center;font-size:.9rem;max-width:min(92%,640px)}
.who-l{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.msg.me .who-l{color:inherit;opacity:.7}
.scen{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.scen button{text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:var(--r);padding:14px;cursor:pointer;display:grid;gap:4px}
.scen button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card)}
.scen b{font-family:var(--f-display);font-size:1.05rem}

/* leerplan */
.plan{display:grid;gap:6px}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--ink);width:100%}
.task .box{width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;flex:none;margin-top:2px;display:grid;place-items:center;font-size:12px;line-height:1}
.task.done{opacity:.6}
.task.done .box{background:var(--good);border-color:var(--good);color:#fff}
.task.done .tt{text-decoration:line-through}
.task .d{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}

/* tekst uit AI */
.md{display:grid;gap:8px;min-width:0;overflow-wrap:anywhere}
.md h4{font-family:var(--f-display);font-size:1.1rem;margin:8px 0 0}
.md ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.md strong{background:linear-gradient(transparent 60%,var(--hl) 60%)}

/* inlogscherm */
.gate{min-height:calc(100vh - 40px);display:grid;place-items:center;padding-block:32px}
.gatebox{width:min(100%,420px);display:grid;gap:18px}
.gatebox .panel{gap:16px}
.gatebox h1{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
.codein{font-family:var(--f-mono);font-size:1.5rem;letter-spacing:.3em;text-align:center}
.err{color:var(--bad);font-size:.92rem;font-weight:700}
.ok{color:var(--good);font-size:.92rem;font-weight:700}

/* bezig + meldingen */
.busy{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--paper);border-radius:0 0 10px 10px;padding:8px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--hl-solid);animation:p 1s infinite alternate}
@keyframes p{to{opacity:.25}}
.toasts{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;z-index:9;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;max-width:520px;font-size:.92rem;pointer-events:auto}
.photos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.ph{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);aspect-ratio:3/4}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .nr{position:absolute;top:6px;left:6px;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-size:.75rem;border-radius:6px;padding:1px 7px}
.ph .tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:2px;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.ph .tools button{border:0;background:rgba(255,255,255,.92);color:#161D36;border-radius:6px;min-width:30px;height:30px;font-size:.9rem;cursor:pointer;padding:0 6px}
.camrow{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.cambtn{display:grid;justify-items:center;gap:4px;text-align:center;padding:16px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-weight:700}
.cambtn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cambtn svg{width:28px;height:28px}
.cambtn{position:relative}
.cambtn input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.gallery{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));margin-bottom:12px}
.gallery a{display:block;border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:3/4;background:var(--card)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.touch-only{display:none}
@media (hover:none),(pointer:coarse){.touch-only{display:initial}.desk-only{display:none}}
.mobile-panel{display:none}
@media (max-width:760px),(pointer:coarse){.mobile-panel{display:grid}}
.mobile-panel.force{display:grid}
.mood{display:grid;gap:6px;padding:12px 14px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line)}
.mood .bar{height:10px}
.mood .bar i{transition:width .4s ease}
.mood.low .bar i{background:var(--bad)} .mood.mid .bar i{background:var(--warn)} .mood.high .bar i{background:var(--good)}
.outcome{border-radius:var(--r);padding:14px 16px;font-weight:700;text-align:center}
.outcome.deal{background:var(--good-bg);color:var(--good)} .outcome.weg{background:var(--bad-bg);color:var(--bad)}
.hint-irritant{border-left:4px solid var(--bad);padding:8px 12px;font-size:.9rem;background:var(--bad-bg);border-radius:0 8px 8px 0}
@media (prefers-reduced-motion: reduce){.mood .bar i{transition:none}}
.voicebar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.9rem}
.voicebar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.voicebar select{width:auto;padding:4px 8px;font-size:.9rem}
.install .appicon{border-radius:12px;flex:none}
.isteps{margin:0;padding-left:1.3em;display:grid;gap:6px}
.isteps .ishare{width:1.15em;height:1.15em;vertical-align:-.2em}
.gateinst{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:8px}
.mic{display:inline-flex;align-items:center;gap:8px;font-weight:700;border-radius:999px;padding:10px 18px;border:1px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;line-height:1.2}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff;animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(191,59,52,.45)}50%{box-shadow:0 0 0 10px rgba(191,59,52,0)}}
.talkrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.livetxt{font-size:.9rem;color:var(--muted);font-style:italic;min-height:1.4em}
.speaking{font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}}
.reqcta{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.price .big{font-family:var(--f-display,inherit);font-weight:800;font-size:2.2rem;line-height:1}
.price .small{flex-basis:100%}
.benefits{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.fs{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 14px;margin:0;display:grid;gap:10px;min-width:0}
.fs legend{font-weight:700;padding:0 6px;font-size:.95rem}
.kv{display:grid;gap:2px}
.seats{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 2px;max-width:320px}
.seats i{display:block;height:100%;background:var(--good)}.seats i.vol{background:var(--bad)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--ink)}
.req{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.req:first-child{padding-top:0}
.req .quote{background:var(--paper);border-radius:8px;padding:10px 12px;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.badge{font-family:var(--f-mono);font-size:.75rem;background:var(--bad);color:#fff;border-radius:20px;padding:0 6px;margin-left:4px}
.aglayout{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}

.agmonth{font-family:var(--f-display);font-size:1.05rem;min-width:140px;text-align:center;text-transform:capitalize}

.aghead{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:2px 0 6px}
.agcell{min-height:86px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:5px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;min-width:0;overflow:hidden}
.agcell.empty{background:transparent;border-color:transparent;cursor:default}
.agcell.past{opacity:.6}
.agcell.today{border-color:var(--hl-solid);box-shadow:inset 0 0 0 2px var(--hl-solid)}
.agcell.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.agnum{font-family:var(--f-mono);font-size:.8rem;font-weight:500}
.agcell.today .agnum{background:var(--hl-solid);color:var(--on-hl);border-radius:4px;padding:0 4px;align-self:flex-start}
.agevs{display:grid;gap:2px;min-width:0}
.agev{font-size:.72rem;line-height:1.25;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card);border:1px solid var(--line)}
.agev.ag-toets{background:var(--bad-bg);border-color:transparent;color:var(--bad);font-weight:700}
.agev.ag-opdr,.agev.ag-deadline{background:var(--warn-bg);border-color:transparent;color:var(--warn);font-weight:700}
.agmore{font-size:.7rem;color:var(--muted)}
.agdots{display:flex;gap:3px;margin-top:auto}
.agdots i,.legdot{width:7px;height:7px;border-radius:50%;background:var(--pen);display:inline-block}
.agdots i.done{background:var(--good)}
.aglegend{gap:14px}
.calbtns{display:flex;flex-wrap:wrap;gap:8px}
.calbtns .btn{text-decoration:none;display:inline-block}
@media (max-width:560px){.agcell{min-height:52px;padding:3px}.agtxt{display:none}.agev{padding:0 3px;text-align:center}.agev.ag-toets,.agev.ag-opdr,.agev.ag-deadline{font-size:.7rem}.agmonth{min-width:0}}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.steps div{display:grid;gap:4px;border-top:3px solid var(--hl-solid);padding-top:10px}
.meter{display:flex;align-items:center;gap:8px}
.meter .bar{flex:1;min-width:60px}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}

<script>
'use strict';
const CFG = window.LEERPULS_CONFIG || {};

const CONFIG_OK = !!(CFG.SUPABASE_URL && CFG.SUPABASE_KEY && !CFG.SUPABASE_URL.includes('JOUW-PROJECT') && !CFG.SUPABASE_KEY.includes('VUL_HIER'));
let sb = null;
try { if (CONFIG_OK && window.supabase) sb = window.supabase.createClient(CFG.SUPABASE_URL.replace(/\/rest\/v1\/?$/, '').replace(/\/$/, ''), CFG.SUPABASE_KEY); } catch (e) { console.error(e); }

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 864e5;
const fmtCijfer = n => (Math.round(Number(n) * 10) / 10).toFixed(1).replace('.', ',');
const vClass = n => Number(n) >= 5.5 ? 'v' : 'o';
const fmtDate = ts => new Date(ts).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
const fmtDay = d => new Date(d + 'T00:00').toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });

function daysUntil(d) { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((new Date(d + 'T00:00') - t) / DAY); }
function toast(msg, ms = 4500) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('#toasts').append(t); setTimeout(() => t.remove(), ms); }
function md(t) {
  const lines = esc(t).split('\n'); let html = '', inList = false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    const h = l.match(/^#{1,4}\s+(.*)/);
    const li = l.match(/^\s*[-*•]\s+(.*)/) || l.match(/^\s*\d+[.)]\s+(.*)/);
    if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${li[1]}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (h) html += `<h4>${h[1]}</h4>`; else if (l.trim()) html += `<p>${l}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('bibliotheek kon niet laden'));
    document.head.append(s);
  });
}
function parseJson(t) {
  t = String(t || '').trim();
  try { return JSON.parse(t); } catch {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch {} }
  const s = t.search(/[\[{]/), e = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if (s >= 0 && e > s) { try { return JSON.parse(t.slice(s, e + 1)); } catch {} }
  throw { code: 'invalid_json' };
}
function download(name, text, type = 'application/json') {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const writers = {};
function chain(key, fn) {
  const w = writers[key] || (writers[key] = { running: null, next: null });
  if (w.running) { w.next = fn; return w.running; }
  const run = async f => {
    try { await f(); } catch (e) { dbErr(e); }
    if (w.next) { const n = w.next; w.next = null; return run(n); }
    w.running = null;
  };
  w.running = run(fn); return w.running;
}
function dbErr(e) { console.error(e); toast('Opslaan lukte niet. Controleer je internetverbinding en probeer het opnieuw.', 6000); }

  vakken: [], docs: [], texts: {}, decks: [], results: [], sessions: [], exams: [], days: new Set(),

const G = { step: 'email', email: '', msg: '', err: '', busy: false, resendAt: 0, reason: '', rq: {}, noAccount: false, canRequest: false };

/* ================= inloggen ================= */

function readRq() {
  const r = G.rq || {}; const pick = (id, k, o) => { const v = gv(id); if (v !== undefined) o[k] = v; };
  const o = {}; pick('rqName', 'name', o); pick('rqEmail', 'email', o); pick('rqOpl', 'opleiding', o); pick('rqGroep', 'groep', o); pick('rqMot', 'motivatie', o); pick('rqOk', 'akkoord', o);

  [['scNaam', 'naam'], ['scKvk', 'kvk'], ['scBtw', 'btw'], ['scAdres', 'adres'], ['scPostcode', 'postcode'], ['scPlaats', 'plaats'], ['scFunctie', 'functie'], ['scTel', 'tel'], ['scFactuur', 'factuur_email'], ['scDomein', 'domeinen'], ['scStud', 'studenten'], ['scDoc', 'docenten'], ['scStart', 'startdatum']].forEach(([id, k]) => pick(id, k, sc));
  return { ...r, ...o, school: sc };

async function schoolCheck(email) { try { const r = await publicFn({ action: 'schoolcheck', email }); return r.school || null; } catch { return null; } }
function authErr(e) {
  const m = (e && e.message || '').toLowerCase();
  if (m.includes('signups not allowed') || m.includes('user not found')) { G.noAccount = true; return 'Dit e-mailadres heeft nog geen Leerpuls-account. Vraag hieronder toegang aan.'; }
  if (m.includes('security purposes') || m.includes('rate limit')) return 'Je hebt net al een code aangevraagd. Wacht een minuut en probeer het opnieuw.';
  if (m.includes('invalid login credentials')) return 'E-mailadres of wachtwoord klopt niet. Nog geen wachtwoord ingesteld? Log dan in met een code.';
  if (m.includes('expired') || m.includes('invalid') && m.includes('token')) return 'Deze code klopt niet of is verlopen. Vraag een nieuwe code aan.';
  if (m.includes('password should be') || m.includes('weak')) return 'Kies een sterker wachtwoord: minimaal 8 tekens.';
  if (m.includes('same password') || m.includes('different from the old')) return 'Kies een ander wachtwoord dan je huidige.';

/* ---- abonnementen (Mollie, Edge Function "Betalingen") ---- */
const ABO = { info: null };
let payReturn = /[?&]betaling=klaar/.test(location.search);
if (payReturn) { try { history.replaceState(null, '', location.pathname); } catch {} }
async function payFn(body, auth) {
  const headers = { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY, Authorization: `Bearer ${CFG.SUPABASE_KEY}` };
  if (auth) { const { data: { session } } = await sb.auth.getSession(); if (!session) throw { error: 'unauthorized' }; headers.Authorization = `Bearer ${session.access_token}`; }
  let res;
  try { res = await fetch(`${CFG.SUPABASE_URL.replace(/\/$/, '')}/functions/v1/${CFG.PAY_FUNCTION || 'Betalingen'}`, { method: 'POST', headers, body: JSON.stringify(body) }); }
  catch { throw { error: 'network' }; }
  const j = await res.json().catch(() => ({}));

}

function showGate(step, extra = {}) { Object.assign(G, { step, err: '', msg: '', busy: false, canRequest: false, payFailed: false, inApp: false }, extra); if (step !== 'email') G.noAccount = false; $('#app').hidden = true; $('#gate').hidden = false; renderGate(); }

async function sendCode(email) {
  G.busy = true; G.err = ''; renderGate();
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
  G.busy = false;
  if (error) { G.err = authErr(error); renderGate(); return false; }
  G.email = email; G.resendAt = Date.now() + 60000; showGate('code', { email, msg: '' }); return true;
}
document.addEventListener('submit', async e => {
  const f = e.target; if (!f.id || !f.id.startsWith('f')) return;
  e.preventDefault();
  if (f.id === 'fEmail') {
    const email = $('#gEmail').value.trim().toLowerCase(); G.email = email; G.noAccount = false;
    const ok = await sendCode(email);
    if (!ok && G.noAccount) { const naam = await schoolCheck(email); if (naam) showGate('school', { email, schoolNaam: naam }); }
  }
  if (f.id === 'fRequest') {
    const rq = { ...readRq(), website: $('#rqSite').value, type: ['docent', 'school'].includes(G.rq.type) ? G.rq.type : 'student' };
    G.rq = rq;
    const bad = m => { G.err = m; renderGate(); };
    if (rq.type === 'school') {
      const sc = rq.school;
      if (sc.naam.length < 2) return bad('Vul de naam van de school in.');
      if (sc.kvk.replace(/\D/g, '').length !== 8) return bad('Een KvK-nummer heeft 8 cijfers.');
      if (sc.btw && !/^[A-Z]{2}[0-9A-Z]{8,12}$/.test(sc.btw.toUpperCase().replace(/[\s.]/g, ''))) return bad('Dit btw-nummer klopt niet. Een Nederlands btw-nummer ziet eruit als NL123456789B01.');
      if (!sc.adres || !sc.plaats) return bad('Vul het adres en de plaats van de school in.');
      if (!sc.domeinen.trim()) return bad('Vul het e-maildomein van de studenten in, bijvoorbeeld hsleiden.nl.');
      if (!(+sc.studenten >= 1)) return bad('Vul in hoeveel studenten Leerpuls ongeveer gaan gebruiken.');
    }
    if (rq.name.length < 2) return bad('Vul je voor- en achternaam in.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(rq.email)) return bad('Vul een geldig e-mailadres in.');
    if (!rq.akkoord) return bad('Vink aan dat je akkoord gaat, anders kunnen we je aanvraag niet bewaren.');
    G.busy = true; G.err = ''; renderGate();
    try { await publicFn({ action: 'request', ...rq }); G.email = rq.email; showGate('requested'); }
    catch (e) {
      G.busy = false;
      G.err = ({ has_account: 'Dit e-mailadres heeft al een account. Ga terug en log in met een code.', pending: 'Er loopt al een aanvraag voor dit e-mailadres. Je krijgt een mail zodra hij is behandeld.', busy: 'Er komen nu veel aanvragen binnen. Probeer het over een uur opnieuw.', bad_email: 'Vul een geldig e-mailadres in.', bad_name: 'Vul je voor- en achternaam in.', no_consent: 'Vink aan dat je akkoord gaat.',
        bad_school: 'Vul de naam van de school in.', bad_kvk: 'Een KvK-nummer heeft 8 cijfers.', bad_btw: 'Dit btw-nummer klopt niet.', bad_adres: 'Vul het adres en de plaats van de school in.', bad_domain: 'Vul een e-maildomein van de school in (geen gmail, hotmail of outlook).', bad_count: 'Vul een geldig aantal studenten in.' })[e.error] || 'Versturen lukte niet. Controleer je internet en probeer het opnieuw.';
      renderGate();
    }
  }
  if (f.id === 'fSchool') {
    const name = $('#schName').value.trim();
    if (name.length < 2) { G.err = 'Vul je voor- en achternaam in.'; renderGate(); return; }
    G.busy = true; G.err = ''; renderGate();
    try { await publicFn({ action: 'schoolcheck', email: G.email, name }); }
    catch (e) { G.busy = false; G.err = 'Dat lukte niet. Probeer het opnieuw.'; renderGate(); return; }

    G.su = su;
    if (su.name.length < 2) { G.err = PAY_ERR.bad_name; renderGate(); return; }

    if (!su.akkoord) { G.err = 'Vink aan dat je akkoord gaat met de voorwaarden en de privacyverklaring.'; renderGate(); return; }
    G.busy = true; G.err = ''; renderGate();

    try { await payFn({ action: 'signup', ...su }); }
    catch (e) { G.busy = false; G.err = PAY_ERR[e.error] || 'Aanmelden lukte niet. Probeer het opnieuw.'; renderGate(); return; }
    G.email = su.email;
    if (await sendCode(su.email)) { G.msg = 'Je account is aangemaakt! We hebben je een inlogcode gestuurd.'; renderGate(); }
  }

    if (error) { G.busy = false; G.err = authErr(error); renderGate(); return; }
    G.busy = false; await start(true);

    G.busy = false; await start(false);
  }
  if (f.id === 'fSet') {
    const a = $('#gNew').value, b = $('#gNew2').value;
    if (a.length < 8) { G.err = 'Je wachtwoord moet minimaal 8 tekens hebben.'; renderGate(); return; }
    if (a !== b) { G.err = 'De twee wachtwoorden zijn niet hetzelfde.'; renderGate(); return; }
    G.busy = true; renderGate();
    const { error } = await sb.auth.updateUser({ password: a, data: { password_set: true } });
    if (error) { G.busy = false; G.err = authErr(error); renderGate(); return; }
    toast('Je wachtwoord is ingesteld.'); showApp();
  }
  if (f.id === 'fAcctPw') {
    const a = $('#acPw').value, b = $('#acPw2').value;
    if (a.length < 8) return toast('Je wachtwoord moet minimaal 8 tekens hebben.');
    if (a !== b) return toast('De twee wachtwoorden zijn niet hetzelfde.');
    const { error } = await sb.auth.updateUser({ password: a, data: { password_set: true } });
    if (error) return toast(authErr(error), 6000);
    $('#acPw').value = ''; $('#acPw2').value = ''; S.user.user_metadata = { ...(S.user.user_metadata || {}), password_set: true };
    toast('Je wachtwoord is opgeslagen.'); render();
  }
});

async function callAI(opts, retried) {
  const { kind, system, messages, prompt, images, tier, max_tokens, onText } = opts;
  const session = await freshSession(!!retried);
  if (!session) throw { code: 'unauthorized' };
  let res;
  try {
    res = await fetch(`${CFG.SUPABASE_URL.replace(/\/$/, "")}/functions/v1/${CFG.AI_FUNCTION || "Ai"}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}`, apikey: CFG.SUPABASE_KEY },
      body: JSON.stringify({ kind, system, messages: messages || [{ role: 'user', content: prompt }], images, tier, max_tokens, stream: !!onText })
    });
  } catch { throw { code: 'network' }; }
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    if (res.status === 401 && !retried) return callAI(opts, true); // sessie vernieuwen en één keer opnieuw proberen
    throw { code: j.error || 'upstream', limit: j.limit };
  }
  const rem = res.headers.get('x-ai-remaining');
  if (rem != null && !S.ai.unlimited) S.ai.used = Math.max(0, S.ai.limit - Number(rem));
  if (!onText) { const j = await res.json(); return j.text || ''; }
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '', text = '';
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data:')) continue;
        let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') { text += ev.delta.text; onText(text); }
        if (ev.type === 'error') throw { code: 'busy' };
      }
    }
  }
  return text;
}

async function addDocument({ title, vakId, text, source, file, photos }) {

  const parts = [];

  for (let i = 0; i < parts.length; i++) {

      vak_id: vakId || null, title: parts.length > 1 ? `${title} (deel ${i + 1})` : title,

      const path = `${S.user.id}/${row.id}/${safe}`;

      if (!error) { await sb.from('documents').update({ file_path: path, file_name: file.name }).eq('id', row.id); row.file_path = path; row.file_name = file.name; }
    }

        const path = `${S.user.id}/${row.id}/foto-${String(k + 1).padStart(2, '0')}.jpg`;
        const { error } = await sb.storage.from('documenten').upload(path, photos[k], { upsert: true, contentType: 'image/jpeg' });

async function readPdf(file) {

  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');

  lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let out = '';

async function drawToJpeg(img, rotate = 0, max = 2000) {
  const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;
  const k = Math.min(1, max / Math.max(w, h)); const dw = Math.round(w * k), dh = Math.round(h * k);
  const turn = rotate % 180 !== 0; const cv = document.createElement('canvas');
  cv.width = turn ? dh : dw; cv.height = turn ? dw : dh;
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.translate(cv.width / 2, cv.height / 2); ctx.rotate(rotate * Math.PI / 180); ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
  if (!blob) throw new Error('canvas');
  return blob;
}

        else { toast(`${f.name}: dit type wordt niet ondersteund. Gebruik PDF, Word (.docx), tekst of foto's.`, 6000); continue; }
        await addDocument({ title: f.name.replace(/\.[^.]+$/, ''), vakId, text, source: ext, file: f });
      } catch (e) { console.error(e); toast(`${f.name} kon niet gelezen worden.`, 6000); }
    }
  } finally { setBusy(null); }
}

/* ================= render ================= */
let scrollChat = false;
function render() {
  const root = $('#app'); if (root.hidden) return;
  const keep = {};
  root.querySelectorAll('input[id],textarea[id],select[id]').forEach(el => { if (el.type !== 'file' && el.type !== 'password' && el.id !== 'vRead' && el.id !== 'vHands' && el.id !== 'vStem' && el.id !== 'mailRem' && el.id !== 'agPlan' && el.id !== 'agUrl') keep[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
  const act = document.activeElement; const fid = act && root.contains(act) && act.id;
  let ss, se; try { ss = act.selectionStart; se = act.selectionEnd; } catch {}
  const openDetails = [...root.querySelectorAll('details')].map(d => d.open);
  root.innerHTML = view();
  for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (!el || el.dataset.filter) continue; if (el.type === 'checkbox') el.checked = v; else el.value = v; }
  root.querySelectorAll('details').forEach((d, i) => { if (openDetails[i]) d.open = true; });
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (ss != null) el.setSelectionRange(ss, se); } catch {} } }
  const box = $('#chatBox'); if (box && scrollChat) box.scrollTop = box.scrollHeight;
  bindDrop(); bindKlasDrop();
}
function bindDrop() {
  const d = $('#drop'); if (!d || d.dataset.b) return; d.dataset.b = 1;
  const f = $('#upFile'); const vakId = S.openVak || null;
  f.addEventListener('change', () => { if (f.files.length) handleFiles([...f.files], vakId, ($('#upTitle') || {}).value); f.value = ''; });
  ['dragenter', 'dragover'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.remove('over'); }));
  d.addEventListener('drop', ev => { if (ev.dataTransfer.files.length) handleFiles([...ev.dataTransfer.files], vakId, ($('#upTitle') || {}).value); });
}
function streamTo(obj) {
  return text => { obj.streaming = text; const el = $('#streamOut'); if (el) { el.textContent = cleanTags(text); const b = $('#chatBox'); if (b) b.scrollTop = b.scrollHeight; } else render(); };
}

/* ================= oefentoets ================= */
async function startQuiz(ids, focus) {
  const qz = S.quiz; const n = +qz.n;
  const soort = { mix: 'een mix van ongeveer 70% meerkeuzevragen en 30% open vragen', mc: 'alleen meerkeuzevragen', open: 'alleen open vragen' }[qz.soort];
  const niveau = { basis: 'basis: kennis en begrip', toets: 'zoals een echte hbo-toets: begrip en toepassen in een situatie', pittig: 'pittig: toepassen, analyseren en verbanden leggen met casussen' }[qz.niveau];
  setBusy('Je oefentoets wordt gemaakt…');
  try {
    const stof = await material(ids);
    const r = await aiJson({ kind: 'toets', prompt: `Je bent een ervaren docent in het Nederlandse hoger onderwijs. Maak een oefentoets van ${n} vragen in het Nederlands, uitsluitend gebaseerd op de studiestof hieronder.
Soort vragen: ${soort}. Niveau: ${niveau}.${focus ? ' Leg de nadruk op: ' + focus + '.' : ''}

Antwoord met alleen JSON in deze vorm:

async function finishQuiz() {

  if (toGrade.length) {

const BOXDAYS = [0, 1, 2, 4, 8, 16];
async function makeDeck(ids) {
  const n = +S.cardsSet.n;
  setBusy('Je flashcards worden gemaakt…');
  try {
    const r = await aiJson({ kind: 'flashcards', prompt: `Maak ${n} flashcards in het Nederlands op basis van de studiestof hieronder. Voorkant: een begrip of korte vraag. Achterkant: een kort en volledig antwoord (maximaal 2 zinnen). Dek de belangrijkste begrippen, modellen en verbanden; geen dubbelingen.

${await material(ids)}` });
    const cards = (r && r.cards || []).filter(c => c && c.front && c.back).map((c, i) => ({ id: 'c' + i, front: String(c.front), back: String(c.back), box: 1, due: 0 }));
    if (!cards.length) throw { code: 'invalid_json' };
    const row = await q(sb.from('decks').insert({ title: String(r.title || 'Flashcards').slice(0, 80), vak_id: commonVak(ids), cards }).select().single());
    S.decks.unshift(row); S.sel.cards.clear();
    toast(`${cards.length} flashcards klaar. Je kunt meteen oefenen.`);
  } catch (e) { e && e.code ? aiErr(e) : dbErr(e); }
  finally { setBusy(null); }
}
function startStudy(deckId, all) {
  const now = Date.now(); const queue = [];
  for (const d of S.decks) { if (deckId && d.id !== deckId) continue; for (const c of d.cards || []) if (all || (c.due || 0) <= now) queue.push({ deckId: d.id, cardId: c.id }); }
  if (!queue.length) { toast('Er staan geen kaarten klaar.'); return; }
  S.study = { queue: shuffle(queue).slice(0, 60), i: 0, flipped: false, known: 0, unknown: 0, retried: new Set() };
  S.tab = 'kaarten'; render(); markStudy();
}
function answerCard(known) {
  const st = S.study; const it = st.queue[st.i];
  const deck = S.decks.find(d => d.id === it.deckId); if (!deck) { st.i++; render(); return; }
  const card = deck.cards.find(c => c.id === it.cardId);
  if (known) { card.box = Math.min(5, (card.box || 1) + 1); card.due = Date.now() + BOXDAYS[card.box] * DAY; st.known++; }
  else { card.box = 1; card.due = Date.now() + DAY; st.unknown++; if (!st.retried.has(it.cardId)) { st.retried.add(it.cardId); st.queue.push(it); } }
  st.i++; st.flipped = false;
  const cards = deck.cards.map(c => ({ ...c }));
  chain('deck:' + deck.id, () => q(sb.from('decks').update({ cards }).eq('id', deck.id)));
  render();
}

async function makePlan(examId) {
  const e = S.exams.find(x => x.id === examId); if (!e) return;
  const dLeft = daysUntil(e.datum);
  if (dLeft < 1) { toast('De toets is vandaag; daar past geen leerplan meer in. Succes!'); return; }
  const ids = S.docs.filter(d => d.vak_id === e.vak_id).map(d => d.id);
  const start = new Date(); if (dLeft > 21) start.setDate(start.getDate() + dLeft - 21);
  setBusy('Je leerplan wordt gemaakt…');
  try {
    const stof = ids.length ? await material(ids, 25000) : '(nog geen stof toegevoegd)';
    const r = await aiJson({ kind: 'leerplan', prompt: `Maak een realistisch leerplan in het Nederlands voor een hbo-student die toets "${e.naam}" (vak ${vakNaam(e.vak_id)}) heeft op ${e.datum}. Plan één taak per dag van ${start.toLocaleDateString('sv-SE')} tot en met de dag vóór de toets. Elke taak is concreet en kost 20 tot 60 minuten, bijvoorbeeld een hoofdstuk lezen, flashcards herhalen, een oefentoets maken, een samenvatting schrijven of een mondeling oefenen. Begin met begrijpen, eindig met oefenen en herhalen; plan de laatste dag licht.
Beschikbare documenten: ${S.docs.filter(d => ids.includes(d.id)).map(d => d.title).join(', ') || 'geen'}.
Antwoord met alleen JSON: {"plan":[{"datum":"YYYY-MM-DD","taak":"..."}]}

STOF (ingekort):
${stof}` });
    const plan = (r && r.plan || []).filter(t => t && /^\d{4}-\d{2}-\d{2}$/.test(t.datum) && t.taak && t.datum < e.datum).map(t => ({ datum: t.datum, taak: String(t.taak), done: false })).sort((a, b) => a.datum.localeCompare(b.datum)).slice(0, 30);
    if (!plan.length) throw { code: 'invalid_json' };
    e.plan = plan; S.openPlan = e.id;
    await q(sb.from('exams').update({ plan }).eq('id', e.id));
    toast(`Leerplan klaar: ${plan.length} dagen tot je toets.`);
  } catch (err) { err && err.code ? aiErr(err) : dbErr(err); }
  finally { setBusy(null); }
}

function dueLabel(d) {

async function addKlasDoc({ klasId, vak, title, text, source, file }) {
  text = (text || '').replace(/\r/g, '').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  if (text.length < 40) { toast(`“${title}” bevat (bijna) geen tekst. Is het een scan? Plak dan de tekst of gebruik een PDF met tekst.`, 7000); return false; }
  const parts = []; for (let i = 0; i < text.length && parts.length < 8; i += MAXCH) parts.push(text.slice(i, i + MAXCH));
  for (let i = 0; i < parts.length; i++) {
    const row = await q(sb.from('klas_docs').insert({ klas_id: klasId, vak: vak || 'Algemeen', title: parts.length > 1 ? `${title} (deel ${i + 1})` : title, text: parts[i], chars: parts[i].length, source })
      .select('id,klas_id,vak,title,chars,source,file_path,file_name,created_by,created_at').single());
    S.texts[row.id] = parts[i];
    if (file && i === 0) {
      const path = `${klasId}/${row.id}/${file.name.replace(/[^\w.\-]+/g, '_').slice(-120)}`;
      const { error } = await sb.storage.from('klasstof').upload(path, file, { upsert: true, contentType: file.type || undefined });
      if (!error) { await sb.from('klas_docs').update({ file_path: path, file_name: file.name }).eq('id', row.id); row.file_path = path; row.file_name = file.name; }
    }
    S.kdocs.unshift(row);
  }
  toast(`“${title}” is gedeeld met ${klasNaam(klasId)}.`);
  return true;
}
async function handleKlasFiles(files) {
  const T = S.T; const vak = ($('#kVak') && $('#kVak').value.trim()) || 'Algemeen'; T.vak = vak;
  try {
    for (const f of Array.from(files)) {
      const ext = f.name.split('.').pop().toLowerCase();
      if (f.size > 40e6) { toast(`${f.name} is groter dan 40 MB.`); continue; }
      try {
        setBusy(`“${f.name}” lezen…`);
        let text = '';
        if (ext === 'pdf') text = await readPdf(f); else if (ext === 'docx') text = await readDocx(f); else if (['txt', 'md', 'csv'].includes(ext)) text = await f.text();
        else { toast(`${f.name}: gebruik PDF, Word (.docx) of tekst.`, 6000); continue; }
        await addKlasDoc({ klasId: T.sel, vak, title: f.name.replace(/\.[^.]+$/, ''), text, source: ext, file: f });
      } catch (e) { console.error(e); toast(`${f.name} kon niet gelezen worden.`, 6000); }
    }
  } finally { setBusy(null); }
}
function bindKlasDrop() {
  const d = $('#kdrop'); if (!d || d.dataset.b) return; d.dataset.b = 1;
  const f = $('#kFile');
  f.addEventListener('change', () => { if (f.files.length) handleKlasFiles([...f.files]); f.value = ''; });
  ['dragenter', 'dragover'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.remove('over'); }));
  d.addEventListener('drop', ev => { if (ev.dataTransfer.files.length) handleKlasFiles([...ev.dataTransfer.files]); });
}

function addDaysStr(s, n) { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv-SE'); }
function icsEscape(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsFold(line) { const enc = new TextEncoder(); if (enc.encode(line).length <= 75) return line; const out = []; let cur = '', len = 0, lim = 75; for (const ch of line) { const n = enc.encode(ch).length; if (len + n > lim) { out.push(cur); cur = ''; len = 0; lim = 74; } cur += ch; len += n; } out.push(cur); return out.join('\r\n '); }
function examIcs(e) {
  const vak = e.vak_id ? vakNaam(e.vak_id) : ''; const d8 = e.datum.replace(/-/g, ''); const next = addDaysStr(e.datum, 1).replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const TZ = ['BEGIN:VTIMEZONE', 'TZID:Europe/Amsterdam', 'BEGIN:DAYLIGHT', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0200', 'TZNAME:CEST', 'DTSTART:19700329T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'END:DAYLIGHT', 'BEGIN:STANDARD', 'TZOFFSETFROM:+0200', 'TZOFFSETTO:+0100', 'TZNAME:CET', 'DTSTART:19701025T030000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD', 'END:VTIMEZONE'];
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Deekman Enterprises//Leerpuls//NL', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', ...(e.tijd ? TZ : []), 'BEGIN:VEVENT', `UID:toets-${e.id}@leerpuls.deekmanenterprises.com`, `DTSTAMP:${stamp}`];
  if (e.tijd) { const [hh, mm] = e.tijd.split(':'); const endH = String(Math.min(23, +hh + 2)).padStart(2, '0'); L.push(`DTSTART;TZID=Europe/Amsterdam:${d8}T${hh}${mm}00`, `DTEND;TZID=Europe/Amsterdam:${d8}T${endH}${mm}00`); }
  else L.push(`DTSTART;VALUE=DATE:${d8}`, `DTEND;VALUE=DATE:${next}`);
  L.push(`SUMMARY:${icsEscape('📝 ' + e.naam + (vak ? ' (' + vak + ')' : ''))}`, `DESCRIPTION:${icsEscape('Toets uit je Leerpuls-toetsplanner.\n' + location.origin + '/')}`);
  if (e.locatie) L.push(`LOCATION:${icsEscape(e.locatie)}`);
  for (const n of [20, 10, 5, 1]) {
    const trig = e.tijd ? `-P${n}D` : (n === 1 ? '-PT15H' : `-P${n - 1}DT15H`); // hele dag: N dagen vooraf om 09:00
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(`Nog ${n} ${n === 1 ? 'dag' : 'dagen'}: ${e.naam}`)}`, `TRIGGER:${trig}`, 'END:VALARM');
  }
  L.push('END:VEVENT', 'END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}

document.addEventListener('click', async e => {

  if (a === 'vakgo') {

      const [vakken, documents, decks, results, sessions, exams] = await Promise.all(['vakken', 'documents', 'decks', 'results', 'sessions', 'exams'].map(t => q(sb.from(t).select('*'))));
      download(`leerpuls-gegevens-${todayStr()}.json`, JSON.stringify({ account: S.account, exported_at: new Date().toISOString(), vakken, documents, decks, results, sessions, exams }, null, 2));
    } finally { setBusy(null); }
    return;
  }
  if (a === 'logout') { await sb.auth.signOut(); return; }
  } catch (err) { dbErr(err); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.photo) { const files = [...(t.files || [])]; t.value = ''; if (files.length) { const ti = $('#phTitle'); if (ti) S.phTitle = ti.value; const pv = $('#phVak'); if (pv) S.phVak = pv.value; await addPhotos(files); render(); } return; }
  if (t.id === 'phVak') { S.phVak = t.value; return; }
  if (t.id === 'mailRem') { try { await q(sb.rpc('set_mail_herinneringen', { p: t.checked })); S.account.mail_herinneringen = t.checked; toast(t.checked ? 'Herinneringsmails staan aan.' : 'Herinneringsmails staan uit.'); render(); } catch (err) { dbErr(err); } return; }
  if (t.id === 'agPlan') { S.ag.plan = t.checked; try { localStorage.setItem('lp_agplan', t.checked ? '1' : '0'); } catch {} render(); toast('Link aangepast. Koppel je agenda opnieuw met de nieuwe link als je dit wilt toepassen.', 7000); return; }
  if (t.dataset && t.dataset.linksel) { if (!t.value) return; try { await q(sb.from('klas_docenten').insert({ klas_id: t.dataset.linksel, docent_email: t.value })); await loadAdminKlassen(); await loadKlasData(); toast('Docent gekoppeld aan de klas.'); render(); } catch (err) { dbErr(err); } return; }
  if (t.dataset && t.dataset.klasof) { try { await q(sb.from('accounts').update({ klas_id: t.value || null }).eq('email', t.dataset.klasof)); const r = (S.admin.rows || []).find(x => x.email === t.dataset.klasof); if (r) r.klas_id = t.value || null; await loadAdminKlassen(); toast(t.value ? `In klas ${klasNaam(t.value)} gezet.` : 'Uit de klas gehaald.'); render(); } catch (err) { dbErr(err); } return; }
  if (t.dataset && t.dataset.rolesel) { try { await q(sb.from('accounts').update({ role: t.value }).eq('email', t.dataset.rolesel)); const r = (S.admin.rows || []).find(x => x.email === t.dataset.rolesel); if (r) r.role = t.value; toast('Rol aangepast.'); render(); } catch (err) { dbErr(err); toast('Rol aanpassen lukte niet. Is docenten.sql al gedraaid?', 7000); } return; }
  if (t.dataset && (t.dataset.sbrol || t.dataset.sbklas || t.dataset.sbbeheer || t.dataset.sblink)) {
    try {
      if (t.dataset.sblink) { if (!t.value) return; await q(sb.rpc('school_docent_koppel', { p_klas: t.dataset.sblink, p_email: t.value, p_aan: true })); toast('Docent gekoppeld.'); }
      else if (t.dataset.sbrol) { await q(sb.rpc('school_lid', { p_email: t.dataset.sbrol, p_wijz: { role: t.value } })); toast(t.value === 'docent' ? 'Nu docent (telt niet meer als plek).' : 'Nu student.'); }
      else if (t.dataset.sbklas) { await q(sb.rpc('school_lid', { p_email: t.dataset.sbklas, p_wijz: { klas_id: t.value || '' } })); toast(t.value ? 'In de klas gezet.' : 'Uit de klas gehaald.'); }
      else if (t.dataset.sbbeheer) { await q(sb.rpc('school_lid', { p_email: t.dataset.sbbeheer, p_wijz: { school_beheer: t.checked } })); toast(t.checked ? 'Is nu ook schoolbeheerder.' : 'Is geen schoolbeheerder meer.'); }
    } catch (err) { toast(err.message || 'Dat lukte niet.', 8000); }
    S.SB = null; render(); return;
  }
  if (t.dataset && (t.dataset.schoolplek || t.dataset.schoolprijs || t.dataset.schooldom)) {
    const id = t.dataset.schoolplek || t.dataset.schoolprijs || t.dataset.schooldom; let upd = {};
    if (t.dataset.schoolplek) upd = { plekken: Math.max(0, Math.min(100000, Math.round(+t.value || 0))) };
    if (t.dataset.schoolprijs) { const v = t.value.trim().replace(',', '.'); upd = { prijs_per_plek: v === '' ? null : Number(v) }; if (v !== '' && !isFinite(Number(v))) { toast('Vul een bedrag in, bijv. 3,50.'); return; } }
    if (t.dataset.schooldom) { const doms = t.value.toLowerCase().split(/[\s,;]+/).map(x => x.replace(/^.*@/, '').trim()).filter(x => /^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(x)); if (!doms.length) { toast('Vul minstens één domein in, bijv. hsleiden.nl.'); return; } upd = { domeinen: doms }; }
    try { await q(sb.from('scholen').update(upd).eq('id', id)); await loadScholen(); toast('Opgeslagen.'); render(); } catch (err) { dbErr(err); }
    return;
  }
  if (t.dataset && t.dataset.gratis) { try { await q(sb.from('accounts').update({ gratis: t.checked }).eq('email', t.dataset.gratis)); toast(t.checked ? 'Gratis toegang aangezet.' : 'Gratis toegang uitgezet. Zonder gratis klas of abonnement moet deze student nu betalen.', 7000); S.admin.rows = null; loadAdmin(); } catch (err) { dbErr(err); t.checked = !t.checked; } return; }
  if (t.dataset && t.dataset.klasgratis) { try { await q(sb.from('klassen').update({ gratis: t.checked }).eq('id', t.dataset.klasgratis)); toast(t.checked ? 'Deze klas is nu gratis.' : 'Deze klas is niet meer gratis.'); S.admin.rows = null; loadAdmin(); } catch (err) { dbErr(err); t.checked = !t.checked; } return; }
  if (t.id === 'vStem') { S.chat.stem = t.value; V.ttsOff = ''; stopSpeaking(); savePrefs(); testStem(); return; }
  if (t.id === 'vRead') { S.chat.read = t.checked; if (!t.checked) stopSpeaking(); else unlockSpeech(); savePrefs(); return; }
  if (t.id === 'vHands') { S.chat.hands = t.checked; if (t.checked) { S.chat.read = true; unlockSpeech(); } else stopListening(); savePrefs(); render(); return; }
  if (t.dataset && t.dataset.move) {
    const id = t.dataset.move; const vak_id = t.value || null;
    try { await q(sb.from('documents').update({ vak_id }).eq('id', id)); S.docs.find(x => x.id === id).vak_id = vak_id; toast(`Verplaatst naar ${vakNaam(vak_id)}.`); render(); } catch (err) { dbErr(err); }
  }
  if (t.dataset && t.dataset.limit) {
    const n = Math.max(0, Math.min(10000, +t.value || 0));
    try { await q(sb.from('accounts').update({ daily_ai_limit: n }).eq('email', t.dataset.limit)); const r = S.admin.rows.find(x => x.email === t.dataset.limit); if (r) r.daily_ai_limit = n; toast('AI-limiet aangepast.'); } catch (err) { dbErr(err); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'phTitle') S.phTitle = e.target.value;
  if (e.target.dataset && e.target.dataset.filter === 'sb') { S.SBfilter = e.target.value; render(); return; }
  if (e.target.dataset && e.target.dataset.filter) { S.admin.filter = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if ($('#app').hidden) return;
  const id = e.target.id;
  if (e.key === 'Enter' && !e.shiftKey && (id === 'chatIn' || id === 'qaIn')) {
    e.preventDefault(); if (S.busy) return;
    if (id === 'chatIn' && S.chat.streaming == null) sendChat();
    if (id === 'qaIn' && S.qa.streaming == null && S.sel.qa.size) askQa();
    return;
  }
  if (e.key === 'Enter' && id === 'vakNaam') { e.preventDefault(); $('[data-act="vakadd"]').click(); return; }
  if (S.study && S.tab === 'kaarten' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {
    if (e.key === ' ' || (e.key === 'Enter' && e.target.classList.contains('icard'))) { e.preventDefault(); S.study.flipped = !S.study.flipped; render(); }
    if (S.study.flipped && (e.key === '1' || e.key === '2')) { e.preventDefault(); answerCard(e.key === '2'); }
  }
});
document.addEventListener('paste', e => {
  if ($('#app').hidden || !((S.tab === 'vakken' && S.openVak !== null) || S.tab === 'vandaag')) return;
  if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const imgs = [...(e.clipboardData && e.clipboardData.files || [])].filter(f => f.type.startsWith('image/'));
  if (imgs.length) { e.preventDefault(); addPhotos(imgs).then(render); }
});

/* ================= opstarten ================= */
(async () => {
  if (!window.LEERPULS_CONFIG) { showGate('blocked', { reason: 'config.js is niet gevonden. Zet config.js in dezelfde map als index.html (in je GitHub-repo). In een voorbeeldweergave werkt de app niet; open hem via je eigen adres.' }); return; }
  if (!CONFIG_OK) { showGate('blocked', { reason: 'Leerpuls is nog niet gekoppeld aan Supabase. Vul in config.js je Supabase-URL en publishable key in.' }); return; }
  if (!sb) { showGate('blocked', { reason: 'De verbinding met Supabase kon niet worden opgezet. Controleer je internetverbinding en de gegevens in config.js.' }); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (session) await start(false); else { showGate('email'); loadAboInfo().then(() => { if (!$('#gate').hidden && G.step === 'email' && aboOn()) renderGate(); }); }
})();
</script>
